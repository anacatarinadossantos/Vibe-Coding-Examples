<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf3f4">
  <title>Gather — a home for your thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf3f4;
      --surface: #fffafb;
      --ink: #33262b;
      --muted: #807179;
      --line: #eadde1;
      --green: #984b68;
      --green-soft: #f5e5eb;
      --orange: #c66b87;
      --orange-soft: #f8e9ee;
      --blue: #597995;
      --blue-soft: #e8eef2;
      --yellow: #a77c2a;
      --yellow-soft: #f4efdf;
      --pink: #a75f78;
      --pink-soft: #f5e8ed;
      --shadow: 0 18px 45px rgba(92, 40, 61, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#ead9df 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 0 42px 64px; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(102, 62, 77, .14);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-family: 'Manrope', sans-serif; font-size: 17px; font-weight: 800; }
    .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; color: #fff; background: var(--green); border-radius: 9px 9px 9px 3px; font-size: 16px; }
    .top-note { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    .intro { padding: 51px 0 29px; animation: arrive .45s ease-out both; }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; color: var(--green); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
    .eyebrow::before { width: 19px; height: 1px; background: var(--orange); content: ''; }
    h1 { margin: 0; font-family: 'Manrope', sans-serif; font-size: clamp(35px, 5vw, 52px); line-height: 1.08; font-weight: 600; letter-spacing: 0; }
    .intro-copy { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid #e8e8df;
      border-radius: 9px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .composer input { min-width: 0; height: 42px; padding: 0 12px; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 14px; }
    .composer input::placeholder { color: #a4969c; }
    .composer select { height: 40px; max-width: 155px; padding: 0 30px 0 11px; border: 1px solid var(--line); border-radius: 6px; color: #555d56; background: #fffefa; cursor: pointer; }
    .add-button { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 104px; height: 40px; padding: 0 15px; border: 0; border-radius: 6px; color: #fff; background: var(--green); font-weight: 600; cursor: pointer; transition: background .18s, transform .18s; }
    .add-button:hover { background: #773750; transform: translateY(-1px); }
    .add-button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #d99bb0; outline-offset: 2px; }
    .add-symbol { font-size: 19px; line-height: 1; font-weight: 400; }
    .workspace { display: grid; grid-template-columns: 215px minmax(0, 1fr); gap: 42px; padding-top: 38px; }
    .sidebar { padding-top: 4px; }
    .side-heading { margin: 0 0 12px 10px; color: #92958d; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
    .category-list { display: grid; gap: 3px; }
    .category-button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 39px; padding: 0 10px; border: 0; border-radius: 6px; color: #5d635d; background: transparent; text-align: left; cursor: pointer; transition: background .15s, color .15s; }
    .category-button:hover { background: rgba(255,255,255,.62); }
    .category-button.active { color: var(--green); background: #f5e7eb; font-weight: 700; }
    .category-icon { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-size: 11px; }
    .category-count { margin-left: auto; color: #9a9d95; font-size: 11px; font-variant-numeric: tabular-nums; }
    .side-footer { display: flex; align-items: center; gap: 7px; margin: 28px 0 0 10px; color: #969990; font-size: 11px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #6e9b78; }
    .main { min-width: 0; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 42px; margin-bottom: 12px; }
    .toolbar h2 { margin: 0; font-family: 'Manrope', sans-serif; font-size: 17px; font-weight: 700; }
    .result-count { margin-left: 8px; color: #92958d; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 400; }
    .search { position: relative; width: min(245px, 48%); }
    .search-icon { position: absolute; top: 50%; left: 11px; width: 14px; height: 14px; color: #8a9088; transform: translateY(-50%); pointer-events: none; }
    .search input { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--line); border-radius: 6px; outline: 0; color: var(--ink); background: rgba(255,254,250,.85); font-size: 12px; }
    .search input:focus { border-color: #d6a4b5; }
    .entries { display: grid; gap: 8px; }
    .entry {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 67px;
      padding: 13px 15px;
      border: 1px solid rgba(231, 216, 222, .95);
      border-radius: 7px;
      background: rgba(255,254,250,.94);
      animation: arrive .28s ease-out both;
    }
    .entry-content { min-width: 0; }
    .entry-text { margin: 0; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; }
    .entry-date { margin-top: 5px; color: #a0a39b; font-size: 10px; }
    .entry-actions { display: flex; align-items: center; gap: 9px; }
    .tag { padding: 5px 9px; border-radius: 4px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .tag[data-category="Work"] { color: var(--green); background: var(--green-soft); }
    .tag[data-category="Ideas"] { color: #b75e36; background: var(--orange-soft); }
    .tag[data-category="Reading"] { color: var(--blue); background: var(--blue-soft); }
    .tag[data-category="Life"] { color: var(--pink); background: var(--pink-soft); }
    .tag[data-category="Errands"] { color: var(--yellow); background: var(--yellow-soft); }
    .tag[data-category="Other"] { color: #696d66; background: #eeeee8; }
    .delete-button { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 5px; color: #a0a39b; background: transparent; cursor: pointer; font-size: 17px; opacity: .58; }
    .delete-button:hover { color: #aa5147; background: #f7e9e6; opacity: 1; }
    .empty-state { display: grid; justify-items: center; padding: 68px 20px; border: 1px dashed #e3cbd4; border-radius: 8px; background: rgba(255,250,251,.7); text-align: center; }
    .empty-mark { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 15px; border: 1px solid #ecd2dc; border-radius: 13px 13px 13px 5px; color: var(--green); background: #f8e9ee; font-family: 'Manrope', sans-serif; font-size: 23px; }
    .empty-state h3 { margin: 0; font-family: 'Manrope', sans-serif; font-size: 15px; }
    .empty-state p { max-width: 290px; margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .clear-button { margin: 26px 0 0 10px; padding: 0; border: 0; color: #a2766d; background: none; font-size: 11px; cursor: pointer; }
    .clear-button:hover { color: #8a443b; text-decoration: underline; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 720px) {
      .shell { padding: 0 22px 42px; }
      .topbar { height: 65px; }
      .intro { padding-top: 38px; }
      .workspace { grid-template-columns: 1fr; gap: 23px; padding-top: 29px; }
      .side-heading { margin-left: 0; }
      .category-list { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 7px; scrollbar-width: thin; }
      .category-button { flex: 0 0 auto; width: auto; min-height: 34px; padding: 0 9px; border: 1px solid var(--line); background: rgba(255,254,250,.8); font-size: 12px; }
      .category-button.active { border-color: #e3c4d0; }
      .category-count { margin-left: 0; }
      .side-footer, .clear-button { display: none; }
      .toolbar { margin-bottom: 9px; }
    }
    @media (max-width: 500px) {
      .shell { padding-right: 16px; padding-left: 16px; }
      .top-note { font-size: 10px; }
      .intro { padding-top: 34px; }
      h1 { font-size: 37px; }
      .intro-copy { font-size: 13px; }
      .composer { grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 8px; }
      .composer input { grid-column: 1 / -1; height: 38px; }
      .composer select { max-width: none; width: 100%; }
      .add-button { min-width: 96px; }
      .workspace { padding-top: 26px; }
      .toolbar { align-items: flex-start; flex-direction: column; gap: 10px; }
      .search { width: 100%; }
      .entry { gap: 7px; padding: 11px; }
      .entry-actions { gap: 5px; }
      .tag { padding: 5px 7px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">g</span> gather</div>
      <span class="top-note">A little order for everyday thoughts</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Your personal index</p>
        <h1 id="page-title">Everything, in its place.</h1>
        <p class="intro-copy">Drop in a thought. Find it when you need it.</p>
      </section>

      <form class="composer" id="entry-form">
        <input id="entry-input" name="entry" type="text" maxlength="240" placeholder="What’s on your mind?" aria-label="Add an item" autocomplete="off" required>
        <select id="category-select" aria-label="Choose a category">
          <option value="auto">Auto-sort</option>
          <option value="Work">Work</option>
          <option value="Ideas">Ideas</option>
          <option value="Reading">Reading</option>
          <option value="Life">Life</option>
          <option value="Errands">Errands</option>
          <option value="Other">Other</option>
        </select>
        <button class="add-button" type="submit"><span class="add-symbol" aria-hidden="true">+</span> Add item</button>
      </form>

      <div class="workspace">
        <aside class="sidebar" aria-label="Categories">
          <p class="side-heading">Your collection</p>
          <nav class="category-list" id="category-list" aria-label="Filter by category"></nav>
          <div class="side-footer"><span class="status-dot" aria-hidden="true"></span> Saved on this device</div>
          <button class="clear-button" id="clear-button" type="button">Clear all items</button>
        </aside>

        <section class="main" aria-labelledby="list-heading">
          <div class="toolbar">
            <h2 id="list-heading">All items <span class="result-count" id="result-count"></span></h2>
            <label class="search">
              <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.5"/><path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <input id="search-input" type="search" placeholder="Search your items" aria-label="Search your items">
            </label>
          </div>
          <div class="entries" id="entries" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const categories = [
      { name: 'All items', icon: '▦', color: '#f5e7eb' },
      { name: 'Work', icon: '↗', color: '#f5e5eb' },
      { name: 'Ideas', icon: '✳', color: '#f8e9ee' },
      { name: 'Reading', icon: '⌕', color: '#e8eef2' },
      { name: 'Life', icon: '♡', color: '#f5e8ed' },
      { name: 'Errands', icon: '✓', color: '#f4efdf' },
      { name: 'Other', icon: '·', color: '#eeeee8' }
    ];
    const storageKey = 'gather-items-v1';
    const rules = {
      Work: /\b(work|meeting|client|project|deadline|email|report|team|office|budget|presentation|launch|follow.?up|manager|proposal)\b/i,
      Ideas: /\b(idea|maybe|could|imagine|invent|create|concept|try|experiment|design|what if|brainstorm)\b/i,
      Reading: /\b(read|book|article|essay|chapter|paper|podcast|watch|listen|course|learn|research)\b/i,
      Errands: /\b(buy|pick up|pickup|grocery|groceries|shop|shopping|return|post office|appointment|book a|call the|pay bill|laundry|repair)\b/i,
      Life: /\b(home|family|friend|birthday|dinner|health|doctor|exercise|travel|trip|recipe|garden|personal|weekend)\b/i
    };
    let items = loadItems();
    let activeCategory = 'All items';

    function loadItems() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return Array.isArray(saved) ? saved.filter(item => item && typeof item.text === 'string' && categories.some(category => category.name === item.category)) : [];
      } catch {
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(items));
      } catch {
        document.querySelector('.side-footer').textContent = 'Browser storage unavailable';
      }
    }

    function sortCategory(text) {
      for (const [category, pattern] of Object.entries(rules)) {
        if (pattern.test(text)) return category;
      }
      return 'Other';
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderCategories() {
      const list = document.getElementById('category-list');
      list.replaceChildren();
      for (const category of categories) {
        const count = category.name === 'All items'
          ? items.length
          : items.filter(item => item.category === category.name).length;
        const button = makeElement('button', `category-button${activeCategory === category.name ? ' active' : ''}`);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(activeCategory === category.name));
        const icon = makeElement('span', 'category-icon', category.icon);
        icon.setAttribute('aria-hidden', 'true');
        icon.style.backgroundColor = category.color;
        const label = makeElement('span', '', category.name);
        const number = makeElement('span', 'category-count', String(count));
        button.append(icon, label, number);
        button.addEventListener('click', () => {
          activeCategory = category.name;
          render();
        });
        list.append(button);
      }
    }

    function renderEntries() {
      const container = document.getElementById('entries');
      const query = document.getElementById('search-input').value.trim().toLocaleLowerCase();
      const visible = items
        .filter(item => activeCategory === 'All items' || item.category === activeCategory)
        .filter(item => !query || `${item.text} ${item.category}`.toLocaleLowerCase().includes(query))
        .sort((a, b) => b.createdAt - a.createdAt);
      const heading = activeCategory;
      document.getElementById('list-heading').childNodes[0].textContent = heading + ' ';
      document.getElementById('result-count').textContent = `${visible.length} ${visible.length === 1 ? 'item' : 'items'}`;
      container.replaceChildren();

      if (visible.length === 0) {
        const empty = makeElement('div', 'empty-state');
        const mark = makeElement('span', 'empty-mark', query ? '⌕' : '+');
        mark.setAttribute('aria-hidden', 'true');
        const title = makeElement('h3', '', query ? 'No matches found' : items.length ? 'Nothing in this category yet' : 'A fresh page');
        const message = makeElement('p', '', query
          ? 'Try a different search, or browse another category.'
          : items.length ? 'Add a thought above, and it’ll find its way here.' : 'Add your first thought above. We’ll sort it into a category for you.');
        empty.append(mark, title, message);
        container.append(empty);
        return;
      }

      for (const [index, item] of visible.entries()) {
        const row = makeElement('article', 'entry');
        row.style.animationDelay = `${Math.min(index, 7) * 25}ms`;
        const content = makeElement('div', 'entry-content');
        content.append(makeElement('p', 'entry-text', item.text));
        const date = new Date(item.createdAt);
        content.append(makeElement('div', 'entry-date', Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(date)));
        const actions = makeElement('div', 'entry-actions');
        const tag = makeElement('span', 'tag', item.category);
        tag.dataset.category = item.category;
        const remove = makeElement('button', 'delete-button', '×');
        remove.type = 'button';
        remove.setAttribute('aria-label', `Delete: ${item.text}`);
        remove.title = 'Delete item';
        remove.addEventListener('click', () => {
          items = items.filter(candidate => candidate.id !== item.id);
          saveItems();
          render();
        });
        actions.append(tag, remove);
        row.append(content, actions);
        container.append(row);
      }
    }

    function render() {
      renderCategories();
      renderEntries();
    }

    document.getElementById('entry-form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('entry-input');
      const text = input.value.trim();
      if (!text) return;
      const selected = document.getElementById('category-select').value;
      items.push({
        id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`,
        text,
        category: selected === 'auto' ? sortCategory(text) : selected,
        createdAt: Date.now()
      });
      saveItems();
      input.value = '';
      activeCategory = 'All items';
      render();
      input.focus();
    });

    document.getElementById('search-input').addEventListener('input', renderEntries);
    document.getElementById('clear-button').addEventListener('click', () => {
      if (items.length && window.confirm('Remove all items from this device?')) {
        items = [];
        saveItems();
        activeCategory = 'All items';
        render();
      }
    });

    render();
  </script>
</body>
</html>
